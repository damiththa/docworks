name: Deploy DocWorks

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: choice
        default: "dev"
        options:
          - "dev"
          - "prod"
      apps:
        description: "App(s) to build and deploy"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "scrubdoc"
          - "diffdoc"
      provider:
        description: "Cloud storage provider flavor(s)"
        required: true
        type: choice
        default: "all_active"
        options:
          - "all_active"
          - "box"
          - "dropbox"
          - "gdrive"
  push:
    branches:
      - dev
      - main
    paths:
      - "apps/**"
      - "shared/**"
      - ".github/workflows/deploy.yml"
      - ".github/deploy-config.json"

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    deploy-${{
      github.event_name == 'workflow_dispatch' && inputs.environment ||
      (github.ref_name == 'main' && 'prod' || 'dev')
    }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve Multi-Provider Deployment Plan
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.target.outputs.should_deploy }}
      env: ${{ steps.target.outputs.env }}
      matrix: ${{ steps.target.outputs.matrix }}
      project_id: ${{ steps.target.outputs.project_id }}
      wif_provider: ${{ steps.target.outputs.wif_provider }}
      deployer_sa: ${{ steps.target.outputs.deployer_sa }}
      runtime_sa: ${{ steps.target.outputs.runtime_sa }}
      ar_repo: ${{ steps.target.outputs.ar_repo }}
      region: ${{ steps.target.outputs.region }}

    steps:
      - name: Checkout repository config
        uses: actions/checkout@v4

      - name: Resolve target environment, apps, and provider matrix
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          VAR_AUTO_DEPLOY_ENABLED: ${{ vars.AUTO_DEPLOY_ENABLED }}
          VAR_AUTO_DEPLOY_DEV: ${{ vars.AUTO_DEPLOY_DEV }}
          VAR_AUTO_DEPLOY_PROD: ${{ vars.AUTO_DEPLOY_PROD }}
          VAR_ACTIVE_PROVIDERS: ${{ vars.ACTIVE_PROVIDERS }}
          VAR_ACTIVE_DEV_PROVIDERS: ${{ vars.ACTIVE_DEV_PROVIDERS }}
          VAR_ACTIVE_PROD_PROVIDERS: ${{ vars.ACTIVE_PROD_PROVIDERS }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          from shared.backend.config import VALID_APPS, VALID_PROVIDERS

          event_name = os.environ["EVENT_NAME"]
          ref_name = os.environ["REF_NAME"]

          if event_name == "workflow_dispatch":
              target_env = os.environ["INPUT_ENV"] or "dev"
              target_apps = os.environ["INPUT_APPS"] or "all"
              target_provider = os.environ["INPUT_PROVIDER"] or "all_active"
          else:
              target_env = "prod" if ref_name == "main" else "dev"
              target_apps = "all"
              target_provider = "all_active"

          cfg_path = Path(".github/deploy-config.json")
          deploy_cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
          env_cfg = deploy_cfg.get(target_env, {})

          def _parse_bool(val: str) -> bool | None:
              v = val.strip().lower()
              if not v:
                  return None
              return v == "true"

          auto_deploy = bool(env_cfg.get("auto_deploy_on_push", False))
          env_override = _parse_bool(
              os.environ.get("VAR_AUTO_DEPLOY_PROD" if target_env == "prod" else "VAR_AUTO_DEPLOY_DEV", "")
          )
          global_override = _parse_bool(os.environ.get("VAR_AUTO_DEPLOY_ENABLED", ""))
          if env_override is not None:
              auto_deploy = env_override
          elif global_override is not None:
              auto_deploy = global_override

          should_deploy = (event_name == "workflow_dispatch") or auto_deploy

          apps = list(VALID_APPS) if target_apps == "all" else [target_apps]
          for a in apps:
              if a not in VALID_APPS:
                  raise SystemExit(f"Unsupported app target '{a}'. Expected one of {VALID_APPS}.")

          prov_override = (
              os.environ.get("VAR_ACTIVE_PROD_PROVIDERS" if target_env == "prod" else "VAR_ACTIVE_DEV_PROVIDERS", "").strip()
              or os.environ.get("VAR_ACTIVE_PROVIDERS", "").strip()
          )
          if prov_override:
              active_providers = [p.strip().lower() for p in prov_override.split(",") if p.strip()]
          else:
              active_providers = [str(p).strip().lower() for p in env_cfg.get("active_providers", ["box"]) if str(p).strip()]

          providers = active_providers if target_provider == "all_active" else [target_provider.strip().lower()]
          for p in providers:
              if p not in VALID_PROVIDERS:
                  raise SystemExit(f"Unsupported provider target '{p}'. Expected one of {VALID_PROVIDERS}.")

          include_matrix = [{"app": a, "provider": p} for p in providers for a in apps] if should_deploy else []
          matrix_json = json.dumps({"include": include_matrix}, separators=(",", ":"))

          project_id = "docworks-514722"
          wif_provider = "projects/746704433311/locations/global/workloadIdentityPools/github-actions/providers/github"
          deployer_sa = "github-deployer@docworks-514722.iam.gserviceaccount.com"
          runtime_sa = (
              "docworks-prod-runner@docworks-514722.iam.gserviceaccount.com"
              if target_env == "prod"
              else "docworks-dev-runner@docworks-514722.iam.gserviceaccount.com"
          )
          ar_repo = "docworks-apps"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_deploy={'true' if should_deploy else 'false'}\n")
              fh.write(f"env={target_env}\n")
              fh.write(f"matrix={matrix_json}\n")
              fh.write(f"project_id={project_id}\n")
              fh.write(f"wif_provider={wif_provider}\n")
              fh.write(f"deployer_sa={deployer_sa}\n")
              fh.write(f"runtime_sa={runtime_sa}\n")
              fh.write(f"ar_repo={ar_repo}\n")
              fh.write("region=us-central1\n")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sfh:
                  if should_deploy:
                      targets = ", ".join(f"{x['app']}-{x['provider']}" for x in include_matrix)
                      sfh.write(f"**Deployment Plan (`{target_env}`):** deploying `{targets}` to `{project_id}`.\n")
                  else:
                      sfh.write(
                          f"**Auto-deploy skipped for `{target_env}` (`{ref_name}`):** "
                          f"`auto_deploy_on_push` is `false` in `.github/deploy-config.json`. "
                          f"Trigger manually via **Run workflow** or flip `auto_deploy_on_push: true` when ready.\n"
                      )
          PY

  deploy:
    name: Deploy ${{ matrix.app }} (${{ matrix.provider }} -> ${{ needs.plan.outputs.env }})
    needs: plan
    if: ${{ needs.plan.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.plan.outputs.env }}
      url: ${{ steps.deploy_service.outputs.url }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Cloud Run service, secrets, and runtime config
        id: cfg
        env:
          ENV_NAME: ${{ needs.plan.outputs.env }}
          APP_ID: ${{ matrix.app }}
          PROVIDER_ID: ${{ matrix.provider }}
          PROJECT_ID: ${{ vars.PROJECT_ID || needs.plan.outputs.project_id }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA || needs.plan.outputs.runtime_sa }}
          AR_REPO: ${{ vars.AR_REPO || needs.plan.outputs.ar_repo }}
          REGION: ${{ vars.REGION || needs.plan.outputs.region }}
          VAR_FREE_SCRUB_LIMIT: ${{ vars.FREE_SCRUB_LIMIT }}
          VAR_FREE_DIFF_LIMIT: ${{ vars.FREE_DIFF_LIMIT }}
          VAR_FREE_RADAR_FIX_LIMIT: ${{ vars.FREE_RADAR_FIX_LIMIT }}
          VAR_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          set -euo pipefail
          APP_UPPER="$(echo "${APP_ID}" | tr '[:lower:]' '[:upper:]')"
          PROV_UPPER="$(echo "${PROVIDER_ID}" | tr '[:lower:]' '[:upper:]')"

          if [[ "${ENV_NAME}" == "dev" ]]; then
            SERVICE_NAME="${APP_ID}-${PROVIDER_ID}-dev"
            SECRET_CLIENT_ID="${PROV_UPPER}_${APP_UPPER}_CLIENT_ID_DEV"
            SECRET_CLIENT_SECRET="${PROV_UPPER}_${APP_UPPER}_CLIENT_SECRET_DEV"
            SECRET_PEPPER="HMAC_PEPPER_${PROV_UPPER}_DEV"
            COLLECTION="entitlements_${PROVIDER_ID}_dev"
            FREE_SCRUB="${VAR_FREE_SCRUB_LIMIT:-25}"
            FREE_DIFF="${VAR_FREE_DIFF_LIMIT:-5}"
            FREE_RADAR="${VAR_FREE_RADAR_FIX_LIMIT:-25}"
            ENV_VARS="APP_ID=${APP_ID},STORAGE_PROVIDER=${PROVIDER_ID},GCP_PROJECT_ID=${PROJECT_ID},USE_FIRESTORE=true,FIRESTORE_COLLECTION=${COLLECTION},FREE_SCRUB_LIMIT=${FREE_SCRUB},FREE_DIFF_LIMIT=${FREE_DIFF},FREE_RADAR_FIX_LIMIT=${FREE_RADAR}"
          else
            SERVICE_NAME="${APP_ID}-${PROVIDER_ID}"
            SECRET_CLIENT_ID="${PROV_UPPER}_${APP_UPPER}_CLIENT_ID"
            SECRET_CLIENT_SECRET="${PROV_UPPER}_${APP_UPPER}_CLIENT_SECRET"
            SECRET_PEPPER="HMAC_PEPPER_${PROV_UPPER}"
            COLLECTION="entitlements_${PROVIDER_ID}"
            ENV_VARS="APP_ID=${APP_ID},STORAGE_PROVIDER=${PROVIDER_ID},GCP_PROJECT_ID=${PROJECT_ID},USE_FIRESTORE=true,FIRESTORE_COLLECTION=${COLLECTION}"
            if [[ -n "${VAR_FREE_SCRUB_LIMIT}" ]]; then
              ENV_VARS="${ENV_VARS},FREE_SCRUB_LIMIT=${VAR_FREE_SCRUB_LIMIT}"
            fi
            if [[ -n "${VAR_FREE_DIFF_LIMIT}" ]]; then
              ENV_VARS="${ENV_VARS},FREE_DIFF_LIMIT=${VAR_FREE_DIFF_LIMIT}"
            fi
            if [[ -n "${VAR_FREE_RADAR_FIX_LIMIT}" ]]; then
              ENV_VARS="${ENV_VARS},FREE_RADAR_FIX_LIMIT=${VAR_FREE_RADAR_FIX_LIMIT}"
            fi
          fi

          if [[ -n "${VAR_SUPPORT_EMAIL}" ]]; then
            ENV_VARS="${ENV_VARS},SUPPORT_EMAIL=${VAR_SUPPORT_EMAIL}"
          fi

          IMAGE_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE_NAME}"
          SECRETS_FLAG="PROVIDER_CLIENT_ID=${SECRET_CLIENT_ID}:latest,PROVIDER_CLIENT_SECRET=${SECRET_CLIENT_SECRET}:latest,HMAC_PEPPER=${SECRET_PEPPER}:latest"

          {
            echo "project_id=${PROJECT_ID}"
            echo "runtime_sa=${RUNTIME_SA}"
            echo "ar_repo=${AR_REPO}"
            echo "region=${REGION}"
            echo "service_name=${SERVICE_NAME}"
            echo "secret_client_id=${SECRET_CLIENT_ID}"
            echo "secret_client_secret=${SECRET_CLIENT_SECRET}"
            echo "secret_pepper=${SECRET_PEPPER}"
            echo "image_base=${IMAGE_BASE}"
            echo "env_vars=${ENV_VARS}"
            echo "secrets_flag=${SECRETS_FLAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud via Keyless OIDC (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || needs.plan.outputs.wif_provider }}
          service_account: ${{ vars.DEPLOYER_SA || needs.plan.outputs.deployer_sa }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Preflight verify Secret Manager versions are enabled
        env:
          PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          SECRET_CLIENT_ID: ${{ steps.cfg.outputs.secret_client_id }}
          SECRET_CLIENT_SECRET: ${{ steps.cfg.outputs.secret_client_secret }}
          SECRET_PEPPER: ${{ steps.cfg.outputs.secret_pepper }}
        run: |
          set -euo pipefail
          for req_secret in "${SECRET_CLIENT_ID}" "${SECRET_CLIENT_SECRET}" "${SECRET_PEPPER}"; do
            if ! versions="$(gcloud secrets versions list "${req_secret}" \
              --project="${PROJECT_ID}" \
              --filter="state=ENABLED" \
              --format="value(name)" 2>&1)"; then
              echo "::error::Cannot inspect secret '${req_secret}' in GCP project '${PROJECT_ID}': ${versions}"
              exit 1
            fi
            ver_count="$(printf '%s\n' "${versions}" | awk 'NF {c++} END {print c+0}')"
            if [[ "${ver_count}" -eq 0 ]]; then
              echo "::error::Secret '${req_secret}' in GCP project '${PROJECT_ID}' has zero ENABLED versions. Populate it before deploying."
              exit 1
            fi
          done
          echo "All required Secret Manager secrets are present and enabled in ${PROJECT_ID}."

      - name: Authenticate Docker to Artifact Registry
        env:
          REGION: ${{ steps.cfg.outputs.region }}
        run: |
          set -euo pipefail
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${REGION}-docker.pkg.dev"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image to Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ steps.cfg.outputs.image_base }}:${{ github.sha }}
            ${{ steps.cfg.outputs.image_base }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Deploy service to Cloud Run
        id: deploy_service
        env:
          PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          REGION: ${{ steps.cfg.outputs.region }}
          SERVICE_NAME: ${{ steps.cfg.outputs.service_name }}
          RUNTIME_SA: ${{ steps.cfg.outputs.runtime_sa }}
          IMAGE_URI: ${{ steps.cfg.outputs.image_base }}:${{ github.sha }}
          ENV_VARS: ${{ steps.cfg.outputs.env_vars }}
          SECRETS_FLAG: ${{ steps.cfg.outputs.secrets_flag }}
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_URI}" \
            --platform=managed \
            --service-account="${RUNTIME_SA}" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=10 \
            --set-env-vars="${ENV_VARS}" \
            --set-secrets="${SECRETS_FLAG}" \
            --quiet

          SERVICE_URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          echo "url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"

      - name: Smoke check deployed Cloud Run endpoints & write summary
        env:
          ENV_NAME: ${{ needs.plan.outputs.env }}
          APP_ID: ${{ matrix.app }}
          PROVIDER_ID: ${{ matrix.provider }}
          PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          SERVICE_NAME: ${{ steps.cfg.outputs.service_name }}
          SERVICE_URL: ${{ steps.deploy_service.outputs.url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEALTH_JSON="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${SERVICE_URL}/health")"
          API_HEALTH_JSON="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${SERVICE_URL}/api/health")"
          PUBLIC_CFG_JSON="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${SERVICE_URL}/api/public-config")"
          echo "Verified /api/public-config: ${PUBLIC_CFG_JSON}"

          for path in "/" "/privacy" "/terms" "/template" "/static/shared/js/suite_shell.js" "/static/providers/registry.js" "/static/app/icon.svg" "/static/app/icon_64.png"; do
            code="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w "%{http_code}" "${SERVICE_URL}${path}")"
            if [[ "${code}" != "200" ]]; then
              echo "::error::Endpoint ${SERVICE_URL}${path} returned HTTP ${code} instead of 200."
              exit 1
            fi
          done

          {
            echo "### Deployed \`${APP_ID}\` (${PROVIDER_ID}) -> \`${ENV_NAME}\`"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| GCP Project | \`${PROJECT_ID}\` |"
            echo "| Cloud Run Service | \`${SERVICE_NAME}\` |"
            echo "| URL | ${SERVICE_URL} |"
            echo "| Image Tag | \`${IMAGE_TAG}\` |"
            echo "| \`/health\` | \`${HEALTH_JSON}\` |"
            echo "| \`/api/health\` | \`${API_HEALTH_JSON}\` |"
            echo "| \`/api/public-config\` | \`${PUBLIC_CFG_JSON}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
