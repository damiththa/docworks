name: Deploy DocWorks

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: choice
        default: "dev"
        options:
          - "dev"
          - "prod"
      apps:
        description: "App(s) to build and deploy"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "scrubdoc"
          - "diffdoc"
      provider:
        description: "Cloud storage provider flavor"
        required: true
        type: choice
        default: "box"
        options:
          - "box"
          - "dropbox"
          - "gdrive"
  push:
    branches:
      - dev
      - main
    paths:
      - "apps/**"
      - "shared/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    deploy-${{
      github.event_name == 'workflow_dispatch' && inputs.environment ||
      (github.ref_name == 'main' && 'prod' || 'dev')
    }}-${{
      github.event_name == 'workflow_dispatch' && inputs.provider || 'box'
    }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve Deployment Plan
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        vars.AUTO_DEPLOY_ENABLED == 'true' ||
        (github.ref_name == 'dev' && vars.AUTO_DEPLOY_DEV == 'true') ||
        (github.ref_name == 'main' && vars.AUTO_DEPLOY_PROD == 'true')
      }}
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.target.outputs.env }}
      provider: ${{ steps.target.outputs.provider }}
      apps_json: ${{ steps.target.outputs.apps_json }}
      project_id: ${{ steps.target.outputs.project_id }}
      wif_provider: ${{ steps.target.outputs.wif_provider }}
      deployer_sa: ${{ steps.target.outputs.deployer_sa }}
      runtime_sa: ${{ steps.target.outputs.runtime_sa }}
      ar_repo: ${{ steps.target.outputs.ar_repo }}
      region: ${{ steps.target.outputs.region }}

    steps:
      - name: Compute target environment, provider, and app matrix
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_APPS: ${{ inputs.apps }}
          INPUT_PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TARGET_ENV="${INPUT_ENV}"
            TARGET_APPS="${INPUT_APPS}"
            TARGET_PROVIDER="${INPUT_PROVIDER}"
          else
            if [[ "${REF_NAME}" == "main" ]]; then
              TARGET_ENV="prod"
            else
              TARGET_ENV="dev"
            fi
            TARGET_APPS="all"
            TARGET_PROVIDER="box"
          fi

          if [[ "${TARGET_APPS}" == "all" ]]; then
            APPS_JSON='["scrubdoc","diffdoc"]'
          else
            APPS_JSON="[\"${TARGET_APPS}\"]"
          fi

          if [[ "${TARGET_ENV}" == "prod" ]]; then
            PROJECT_ID="docworks-514722"
            WIF_PROVIDER="projects/746704433311/locations/global/workloadIdentityPools/github-actions/providers/github"
            DEPLOYER_SA="github-deployer@docworks-514722.iam.gserviceaccount.com"
            RUNTIME_SA="docworks-prod-runner@docworks-514722.iam.gserviceaccount.com"
            AR_REPO="docworks-apps"
          else
            PROJECT_ID="safeshare-box"
            WIF_PROVIDER="projects/902354967061/locations/global/workloadIdentityPools/github-actions/providers/github"
            DEPLOYER_SA="github-deployer@safeshare-box.iam.gserviceaccount.com"
            RUNTIME_SA="902354967061-compute@developer.gserviceaccount.com"
            AR_REPO="cloud-run-source-deploy"
          fi

          {
            echo "env=${TARGET_ENV}"
            echo "provider=${TARGET_PROVIDER}"
            echo "apps_json=${APPS_JSON}"
            echo "project_id=${PROJECT_ID}"
            echo "wif_provider=${WIF_PROVIDER}"
            echo "deployer_sa=${DEPLOYER_SA}"
            echo "runtime_sa=${RUNTIME_SA}"
            echo "ar_repo=${AR_REPO}"
            echo "region=us-central1"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy ${{ matrix.app }} (${{ needs.plan.outputs.provider }} -> ${{ needs.plan.outputs.env }})
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.plan.outputs.env }}
      url: ${{ steps.deploy_service.outputs.url }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps_json) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Cloud Run service, secrets, and runtime config
        id: cfg
        env:
          ENV_NAME: ${{ needs.plan.outputs.env }}
          APP_ID: ${{ matrix.app }}
          PROVIDER_ID: ${{ needs.plan.outputs.provider }}
          PROJECT_ID: ${{ vars.PROJECT_ID || needs.plan.outputs.project_id }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA || needs.plan.outputs.runtime_sa }}
          AR_REPO: ${{ vars.AR_REPO || needs.plan.outputs.ar_repo }}
          REGION: ${{ vars.REGION || needs.plan.outputs.region }}
          VAR_FREE_SCRUB_LIMIT: ${{ vars.FREE_SCRUB_LIMIT }}
          VAR_FREE_DIFF_LIMIT: ${{ vars.FREE_DIFF_LIMIT }}
          VAR_FREE_RADAR_FIX_LIMIT: ${{ vars.FREE_RADAR_FIX_LIMIT }}
        run: |
          set -euo pipefail
          APP_UPPER="$(echo "${APP_ID}" | tr '[:lower:]' '[:upper:]')"
          PROV_UPPER="$(echo "${PROVIDER_ID}" | tr '[:lower:]' '[:upper:]')"

          # Preserve existing DEV Cloud Run URLs & Secret Manager bindings for Box.
          if [[ "${ENV_NAME}" == "dev" && "${PROVIDER_ID}" == "box" ]]; then
            if [[ "${APP_ID}" == "scrubdoc" ]]; then
              SERVICE_NAME="safeshare"
              SECRET_CLIENT_ID="BOX_CLIENT_ID"
              SECRET_CLIENT_SECRET="BOX_CLIENT_SECRET"
            else
              SERVICE_NAME="boxdiff"
              SECRET_CLIENT_ID="BOXDIFF_CLIENT_ID"
              SECRET_CLIENT_SECRET="BOXDIFF_CLIENT_SECRET"
            fi
            SECRET_PEPPER="HMAC_PEPPER"
            FREE_SCRUB="${VAR_FREE_SCRUB_LIMIT:-25}"
            FREE_DIFF="${VAR_FREE_DIFF_LIMIT:-5}"
            FREE_RADAR="${VAR_FREE_RADAR_FIX_LIMIT:-25}"
            ENV_VARS="APP_ID=${APP_ID},STORAGE_PROVIDER=${PROVIDER_ID},GCP_PROJECT_ID=${PROJECT_ID},USE_FIRESTORE=true,FIRESTORE_COLLECTION=entitlements_${PROVIDER_ID},FREE_SCRUB_LIMIT=${FREE_SCRUB},FREE_DIFF_LIMIT=${FREE_DIFF},FREE_RADAR_FIX_LIMIT=${FREE_RADAR}"
          else
            SERVICE_NAME="${APP_ID}-${PROVIDER_ID}"
            SECRET_CLIENT_ID="${PROV_UPPER}_${APP_UPPER}_CLIENT_ID"
            SECRET_CLIENT_SECRET="${PROV_UPPER}_${APP_UPPER}_CLIENT_SECRET"
            SECRET_PEPPER="HMAC_PEPPER_${PROV_UPPER}"
            ENV_VARS="APP_ID=${APP_ID},STORAGE_PROVIDER=${PROVIDER_ID},GCP_PROJECT_ID=${PROJECT_ID},USE_FIRESTORE=true,FIRESTORE_COLLECTION=entitlements_${PROVIDER_ID}"
            if [[ -n "${VAR_FREE_SCRUB_LIMIT}" ]]; then
              ENV_VARS="${ENV_VARS},FREE_SCRUB_LIMIT=${VAR_FREE_SCRUB_LIMIT}"
            fi
            if [[ -n "${VAR_FREE_DIFF_LIMIT}" ]]; then
              ENV_VARS="${ENV_VARS},FREE_DIFF_LIMIT=${VAR_FREE_DIFF_LIMIT}"
            fi
            if [[ -n "${VAR_FREE_RADAR_FIX_LIMIT}" ]]; then
              ENV_VARS="${ENV_VARS},FREE_RADAR_FIX_LIMIT=${VAR_FREE_RADAR_FIX_LIMIT}"
            fi
          fi

          IMAGE_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE_NAME}"
          SECRETS_FLAG="PROVIDER_CLIENT_ID=${SECRET_CLIENT_ID}:latest,PROVIDER_CLIENT_SECRET=${SECRET_CLIENT_SECRET}:latest,HMAC_PEPPER=${SECRET_PEPPER}:latest"

          {
            echo "project_id=${PROJECT_ID}"
            echo "runtime_sa=${RUNTIME_SA}"
            echo "ar_repo=${AR_REPO}"
            echo "region=${REGION}"
            echo "service_name=${SERVICE_NAME}"
            echo "secret_client_id=${SECRET_CLIENT_ID}"
            echo "secret_client_secret=${SECRET_CLIENT_SECRET}"
            echo "secret_pepper=${SECRET_PEPPER}"
            echo "image_base=${IMAGE_BASE}"
            echo "env_vars=${ENV_VARS}"
            echo "secrets_flag=${SECRETS_FLAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud via Keyless OIDC (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || needs.plan.outputs.wif_provider }}
          service_account: ${{ vars.DEPLOYER_SA || needs.plan.outputs.deployer_sa }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Preflight verify Secret Manager versions are enabled
        env:
          PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          SECRET_CLIENT_ID: ${{ steps.cfg.outputs.secret_client_id }}
          SECRET_CLIENT_SECRET: ${{ steps.cfg.outputs.secret_client_secret }}
          SECRET_PEPPER: ${{ steps.cfg.outputs.secret_pepper }}
        run: |
          set -euo pipefail
          for req_secret in "${SECRET_CLIENT_ID}" "${SECRET_CLIENT_SECRET}" "${SECRET_PEPPER}"; do
            if ! versions="$(gcloud secrets versions list "${req_secret}" \
              --project="${PROJECT_ID}" \
              --filter="state=ENABLED" \
              --format="value(name)" 2>&1)"; then
              echo "::error::Cannot inspect secret '${req_secret}' in GCP project '${PROJECT_ID}': ${versions}"
              exit 1
            fi
            ver_count="$(printf '%s\n' "${versions}" | awk 'NF {c++} END {print c+0}')"
            if [[ "${ver_count}" -eq 0 ]]; then
              echo "::error::Secret '${req_secret}' in GCP project '${PROJECT_ID}' has zero ENABLED versions. Populate it before deploying."
              exit 1
            fi
          done
          echo "All required Secret Manager secrets are present and enabled in ${PROJECT_ID}."

      - name: Authenticate Docker to Artifact Registry
        env:
          REGION: ${{ steps.cfg.outputs.region }}
        run: |
          set -euo pipefail
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${REGION}-docker.pkg.dev"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image to Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ steps.cfg.outputs.image_base }}:${{ github.sha }}
            ${{ steps.cfg.outputs.image_base }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Deploy service to Cloud Run
        id: deploy_service
        env:
          PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          REGION: ${{ steps.cfg.outputs.region }}
          SERVICE_NAME: ${{ steps.cfg.outputs.service_name }}
          RUNTIME_SA: ${{ steps.cfg.outputs.runtime_sa }}
          IMAGE_URI: ${{ steps.cfg.outputs.image_base }}:${{ github.sha }}
          ENV_VARS: ${{ steps.cfg.outputs.env_vars }}
          SECRETS_FLAG: ${{ steps.cfg.outputs.secrets_flag }}
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_URI}" \
            --platform=managed \
            --service-account="${RUNTIME_SA}" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=10 \
            --set-env-vars="${ENV_VARS}" \
            --set-secrets="${SECRETS_FLAG}" \
            --quiet

          SERVICE_URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          echo "url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"

      - name: Smoke check deployed Cloud Run endpoints & write summary
        env:
          ENV_NAME: ${{ needs.plan.outputs.env }}
          APP_ID: ${{ matrix.app }}
          PROVIDER_ID: ${{ needs.plan.outputs.provider }}
          PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          SERVICE_NAME: ${{ steps.cfg.outputs.service_name }}
          SERVICE_URL: ${{ steps.deploy_service.outputs.url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEALTH_JSON="$(curl -fsS "${SERVICE_URL}/health")"
          API_HEALTH_JSON="$(curl -fsS "${SERVICE_URL}/api/health")"

          for path in "/" "/privacy" "/terms" "/template"; do
            code="$(curl -sS -o /dev/null -w "%{http_code}" "${SERVICE_URL}${path}")"
            if [[ "${code}" != "200" ]]; then
              echo "::error::Endpoint ${SERVICE_URL}${path} returned HTTP ${code} instead of 200."
              exit 1
            fi
          done

          {
            echo "### Deployed \`${APP_ID}\` (${PROVIDER_ID}) -> \`${ENV_NAME}\`"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| GCP Project | \`${PROJECT_ID}\` |"
            echo "| Cloud Run Service | \`${SERVICE_NAME}\` |"
            echo "| URL | ${SERVICE_URL} |"
            echo "| Image Tag | \`${IMAGE_TAG}\` |"
            echo "| \`/health\` | \`${HEALTH_JSON}\` |"
            echo "| \`/api/health\` | \`${API_HEALTH_JSON}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
